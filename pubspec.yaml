name: manastiri_pelerini
description: "Find Orthodox monasteries near you in Romania: 661 places with distance, direction, map and a personal pilgrimage journal."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.0
  sqflite: ^2.3.3
  path: ^1.9.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/manastiri.json
